name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Validate frontend
        run: |
          npm --prefix web run typecheck
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build

      - name: Test backend
        run: |
          go vet ./...
          go test -race ./...

      - name: Build companion
        run: go build ./cmd/wt-modern

      - name: Build Windows tray application
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -X github.com/NolanMullins/wt-modern-8111/internal/buildinfo.Version=0.0.0" -o wt-modern.exe ./cmd/wt-modern

  windows-tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet Windows integration
        run: go vet ./cmd/wt-modern ./internal/autostart ./internal/updater

      - name: Test Windows integration
        run: go test ./cmd/wt-modern ./internal/autostart ./internal/updater

      - name: Build Windows tray application
        run: go build -ldflags="-H windowsgui -X github.com/NolanMullins/wt-modern-8111/internal/buildinfo.Version=0.0.0" -o wt-modern.exe ./cmd/wt-modern

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version 0.0.0
