name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, without the v prefix"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: wt-modern-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        run: |
          if ($env:EVENT_NAME -ne "workflow_dispatch" -or $env:GIT_REF -ne "refs/heads/main") {
            throw "Releases must be manually dispatched from the main branch"
          }
          $version = $env:DISPATCH_VERSION
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid semantic version: $version"
          }
          git ls-remote --exit-code --tags origin "refs/tags/v$version" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release tag v$version already exists"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build portable executable
        shell: pwsh
        run: |
          .\scripts\build-windows.ps1 -Version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force `
            "dist\wt-modern.exe" `
            "dist\wt-modern-windows-amd64.exe"

      - name: Upload unsigned portable executable
        id: upload-unsigned-portable
        uses: actions/upload-artifact@v4
        with:
          name: wt-modern-portable-unsigned
          path: dist\wt-modern-windows-amd64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign portable executable
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist\signed-portable

      - name: Install signed portable executable
        shell: pwsh
        run: |
          $signed = Get-ChildItem "dist\signed-portable" -Recurse `
            -Filter "wt-modern-windows-amd64.exe" |
            Select-Object -First 1
          if (!$signed) { throw "SignPath did not return the portable executable" }
          Copy-Item -Force $signed.FullName "dist\wt-modern-windows-amd64.exe"

      - name: Build installer from signed executable
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -SkipPortableBuild

      - name: Upload unsigned installer
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: wt-modern-installer-unsigned
          path: dist\wt-modern-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist\signed-installer

      - name: Install and verify signed release assets
        shell: pwsh
        run: |
          $signed = Get-ChildItem "dist\signed-installer" -Recurse `
            -Filter "wt-modern-setup.exe" |
            Select-Object -First 1
          if (!$signed) { throw "SignPath did not return the installer" }
          Copy-Item -Force $signed.FullName "dist\wt-modern-setup.exe"

          $assets = @(
            "dist\wt-modern-windows-amd64.exe",
            "dist\wt-modern-setup.exe"
          )
          foreach ($asset in $assets) {
            $signature = Get-AuthenticodeSignature $asset
            if ($signature.Status -ne "Valid") {
              throw "$asset has invalid Authenticode status: $($signature.Status)"
            }
          }
          .\scripts\write-checksums.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "dist\wt-modern-windows-amd64.exe" `
            "dist\wt-modern-setup.exe" `
            "dist\checksums.txt" `
            --target "$env:GITHUB_SHA" `
            --title "WT Modern 8111 $env:RELEASE_TAG" `
            --generate-notes `
            --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
